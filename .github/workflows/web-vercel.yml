name: Deploy web to Vercel

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'solver/crates/core/**'
      - 'solver/crates/wasm/**'
      - 'solver/Cargo.*'
      - 'solver/rust-toolchain.toml'
      - '.github/workflows/web-*.yml'
      - '.github/vercel/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  PRODUCTION: ${{ github.ref == 'refs/heads/master' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'vercel-production' || 'vercel-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: solver
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            .github/vercel/package-lock.json
      - id: credentials
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'vercel-production' || 'vercel-preview' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRODUCTION" = "true" ]; then
            echo "::error::The $ENVIRONMENT environment has no Vercel secrets"
            exit 1
          else
            echo "The $ENVIRONMENT environment has no Vercel secrets, so the preview deploy is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          node tools/deploy/vercelConfig.ts vercel-output-config.json .vercel/output/config.json
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      - if: steps.credentials.outputs.ready == 'true'
        working-directory: .github/vercel
        run: npm ci
      - id: deploy
        if: steps.credentials.outputs.ready == 'true'
        working-directory: .github/vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          args=(deploy --prebuilt --yes --cwd "$GITHUB_WORKSPACE/web" --token "$VERCEL_TOKEN")
          if [ "$PRODUCTION" = "true" ]; then args+=(--prod); fi
          url=$(npx vercel "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
