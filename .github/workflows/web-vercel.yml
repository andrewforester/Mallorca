name: Deploy web to Vercel

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'solver/crates/core/**'
      - 'solver/crates/wasm/**'
      - 'solver/Cargo.*'
      - 'solver/rust-toolchain.toml'
      - '.github/workflows/web-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  PRODUCTION: ${{ github.ref == 'refs/heads/master' }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'vercel-production' || 'vercel-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
      - id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(deploy --prebuilt --yes --token "$VERCEL_TOKEN")
          if [ "$PRODUCTION" = "true" ]; then args+=(--prod); fi
          url=$(npx --yes vercel@63.1.2 "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
