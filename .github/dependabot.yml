version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /.github/vercel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vercel-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /solver
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      solver-minor-and-patch:
        update-types:
          - minor
          - patch
