[package]
name = "mallorca-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["presets"]
presets = ["dep:serde", "dep:toml", "dep:sha2"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
flate2 = "1"
