<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Face Sandbox</title>
    <link rel="stylesheet" href="./sandbox.css" />
  </head>
  <body>
    <div class="page">
      <div class="stage" id="stage"><div class="loading" id="loading">Загружаю лицо…</div></div>
      <div class="panel">
        <section>
          <h2>Персонаж</h2>
          <select id="character"></select>
        </section>
        <section>
          <h2>Состояния</h2>
          <div class="buttons" id="presets"></div>
        </section>
        <section>
          <h2>Эмоции</h2>
          <div class="sliders" id="emotions"></div>
        </section>
        <section>
          <h2>Настроение</h2>
          <div class="sliders" id="mood"></div>
        </section>
        <section>
          <h2>Маска</h2>
          <label class="check"><input type="checkbox" id="ownMask" /> маска персонажа</label>
          <div class="sliders" id="maskBox"></div>
        </section>
        <section>
          <h2>Вспышка</h2>
          <div class="buttons" id="pulses"></div>
        </section>
        <section>
          <h2>Что видит лицо</h2>
          <pre id="readout"></pre>
        </section>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
